name: Cleanup legacy Telegram code

on:
  push:
    branches:
      - security/remove-telegram-residue

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'security: remove legacy telegram code') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/remove-telegram-residue
          fetch-depth: 1

      - name: Remove legacy Telegram client code
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start_marker = '  /* ═══ TELEGRAM CONFIG ═══ */'
          end_marker = '  /* ═══ UI ═══ */'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Legacy Telegram block markers not found')

          replacement = '''  /* ═══ LEAD SUBMISSION ═══ */
  const WHATSAPP_NUMBER = '918942954415';

  async function submitLead(e){
    e.preventDefault();
    const btn = document.getElementById('leadSubmitBtn');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.style.opacity = '.7';
    btn.innerHTML = 'Sending…';

    const details = {
      name: document.getElementById('leadName').value.trim(),
      phone: document.getElementById('leadPhone').value.trim(),
      neet: document.getElementById('leadNeet').value,
      country: document.getElementById('countrySelect').value,
      budget: document.getElementById('leadBudget').value,
      website: document.getElementById('leadWebsite')?.value || ''
    };

    try{
      const res = await fetch('/api/lead', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(details)
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok || !data.ok) throw new Error(data.error || 'Unable to submit your request.');
      showLeadSuccess();
    }catch(err){
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.innerHTML = originalHTML;
      showLeadError(details, err.message);
    }
  }

  function showLeadSuccess(){
    document.getElementById('leadForm').innerHTML = `
      <div class="success-box">
        <div class="success-icon">✓</div>
        <h3 class="serif">Thank you.</h3>
        <p>Your request has been received.<br/>A doctor-founder will call you within <b>15 minutes</b>.</p>
      </div>`;
  }

  function showLeadError(d, reason){
    let box = document.getElementById('leadErrorBox');
    if(!box){
      box = document.createElement('div');
      box.id = 'leadErrorBox';
      box.style.cssText = 'background:#FBF1E7;border:1px solid #EBD3AE;color:#6B4A17;border-radius:10px;padding:12px;font-size:12.5px;margin-bottom:10px;line-height:1.6';
      document.getElementById('leadFormEl').prepend(box);
    }
    const waText = encodeURIComponent(`Hi, I want MBBS abroad details.\\nName: ${d.name}\\nPhone: ${d.phone}\\nNEET: ${d.neet}\\nCountry: ${d.country}\\nBudget: ${d.budget}`);
    box.innerHTML = `⚠️ <b>Couldn't send just now.</b> Please try again, or reach us instantly:<br/><a href="https://wa.me/${WHATSAPP_NUMBER}?text=${waText}" target="_blank" rel="noopener" style="color:#0E7C5B;font-weight:700;text-decoration:underline">Continue on WhatsApp →</a>`;
  }

'''

          s = s[:start] + replacement + s[end:]

          # Add a hidden honeypot field to reduce automated submissions.
          if 'id="leadWebsite"' not in s:
              marker = '        <form id="leadFormEl" onsubmit="submitLead(event)">'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('Lead form marker not found')
              insert = pos + len(marker)
              honeypot = '\n          <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label>Website <input type="text" id="leadWebsite" name="website" tabindex="-1" autocomplete="off"></label></div>'
              s = s[:insert] + honeypot + s[insert:]

          if re.search(r'TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|api\.telegram\.org/bot', s):
              raise SystemExit('Legacy Telegram secret/API reference remains in index.html')

          p.write_text(s, encoding='utf-8')
          print('Legacy Telegram frontend code removed successfully.')
      
      - name: Commit cleaned frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'security: remove legacy telegram code'
          git push origin HEAD:security/remove-telegram-residue
