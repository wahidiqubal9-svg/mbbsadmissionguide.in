name: DeepSeek Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  agent:
    if: |
      !github.event.issue.pull_request &&
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'cloudflare-workers-and-pages[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Issue Branch if Exists
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="ai-fix-issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH exists on remote. Checking it out."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Branch $BRANCH does not exist yet. Creating it from main."
            git checkout -b "$BRANCH"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Base Packages
        run: pip install openai requests

      - name: Run DeepSeek Engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os, sys, re, requests
          from openai import OpenAI

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          token = os.environ.get("GITHUB_TOKEN", "").strip()
          issue_no = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPO_NAME"]
          actor = os.environ["ACTOR"]
          user_text = os.environ.get("COMMENT_BODY", "").strip()

          if not api_key:
              print("DEEPSEEK_API_KEY secret is missing!")
              sys.exit(1)

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }
          comment_url = f"https://api.github.com/repos/{repo}/issues/{issue_no}/comments"

          def post_comment(text):
              requests.post(comment_url, headers=headers, json={"body": text})

          issue_data = requests.get(f"https://api.github.com/repos/{repo}/issues/{issue_no}", headers=headers).json()
          comments_data = requests.get(comment_url, headers=headers).json()

          convo = f"Title: {issue_data.get('title', '')}\nTask: {issue_data.get('body', '')}\n\n"
          if isinstance(comments_data, list):
              for c in comments_data:
                  login = c.get("user", {}).get("login", "")
                  body = c.get('body', '')
                  # Clean bot responses to avoid confusing context
                  if "[bot]" in login:
                      body = re.sub(r"===FILE:.*?===END FILE===\n?", "<FILE_CHANGES_HIDDEN>", body, flags=re.DOTALL).strip()
                  convo += f"{login}: {body}\n"

          code_dump = ""
          valid_exts = (".html", ".css", ".js", ".json", ".md")
          skip_dirs = {".git", ".github", "node_modules", "dist", "build"}

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".") and d not in skip_dirs]
              for f in files:
                  if f.endswith(valid_exts) and len(code_dump) < 60000:
                      fpath = os.path.relpath(os.path.join(root, f), ".")
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="ignore") as file_read:
                              code_dump += f"\n\n--- [FILE: {fpath}] ---\n{file_read.read(8000)}\n"
                      except Exception:
                          pass

          client = OpenAI(api_key=api_key, base_url="https://api.deepseek.com")

          # -------------------------------------------------------------
          # UNIFIED MODE: DISCUSS OR EXECUTE
          # -------------------------------------------------------------
          sys_prompt = (
              "You are an autonomous senior developer.\n"
              "You can both discuss solutions and apply code changes.\n"
              "Analyze the user request and the codebase.\n\n"
              "If the user is asking you to modify the code, or giving you permission to proceed, you MUST output the updated files.\n"
              "To update files, you must output them in the exact following format:\n\n"
              "===FILE: path/to/file.ext===\n"
              "[complete updated file content]\n"
              "===END FILE===\n\n"
              "If you output the file block above, the code will be automatically committed and pushed to a PR branch.\n"
              "If the user is just asking a question and not asking for code changes, simply answer their question in Markdown.\n\n"
              f"Conversation History:\n{convo}\n\n"
              f"Codebase Files:\n{code_dump}\n"
          )

          messages = [{"role": "system", "content": sys_prompt}]

          # Only append the current user text, as the full history is already in `convo`
          messages.append({"role": "user", "content": user_text})

          res = client.chat.completions.create(
              model="deepseek-chat",
              messages=messages,
              temperature=0.1
          )

          answer = res.choices[0].message.content

          # Clean any weird artifact tokens
          answer = re.sub(r"<\s*\|\s*\|\s*DSML.*?</\s*\|\s*\|\s*tool_calls\s*>", "", answer, flags=re.DOTALL).strip()
          answer = re.sub(r"<\|.*?\|>", "", answer).strip()

          # Check if the AI decided to execute changes
          matches = re.findall(r"===FILE:\s*(.+?)===\s*\n(.*?)===END FILE===", answer, re.DOTALL)

          if matches:
              post_comment("🤖 **I have generated code changes.** Applying them to the PR branch now...")
              for fpath, body in matches:
                  fpath = fpath.strip()
                  folder = os.path.dirname(fpath)
                  if folder:
                      os.makedirs(folder, exist_ok=True)
                  with open(fpath, "w", encoding="utf-8") as fw:
                      fw.write(body.strip())

              with open("mode.txt", "w") as m:
                  m.write("EXECUTE")

              # Strip the file blocks out of the comment to keep it clean
              clean_answer = re.sub(r"===FILE:.*?===END FILE===\n?", "", answer, flags=re.DOTALL).strip()
              if clean_answer:
                  post_comment(clean_answer)

          else:
              post_comment(answer)
              with open("mode.txt", "w") as m:
                  m.write("DISCUSS")
          EOF

      - name: Commit, Push and Open Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          MODE=$(cat mode.txt 2>/dev/null || echo "DISCUSS")
          if [ "$MODE" != "EXECUTE" ]; then
            echo "Discussion step complete. Exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ai-fix-issue-${ISSUE_NUMBER}"

          git add -A
          git commit -m "AI fixes for #${ISSUE_NUMBER}: ${ISSUE_TITLE}" || echo "No changes detected."

          # Only push if there's a branch to push (which there will be, either fresh from main or existing from checkout step)
          git push -u origin "$BRANCH"

          # Open PR if it doesn't already exist
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Fixes for #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUMBER}. Autonomous updates applied by DeepSeek V3." 2>/dev/null || gh pr view "$BRANCH" --json url -q .url)

          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Mention User on Complete
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          MODE=$(cat mode.txt 2>/dev/null || echo "DISCUSS")
          if [ "$MODE" != "EXECUTE" ]; then
            exit 0
          fi

          python - << 'EOF'
          import os, requests
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO_NAME"]
          issue = os.environ["ISSUE_NUMBER"]
          actor = os.environ["ACTOR"]
          pr_url = os.environ.get("PR_URL", f"https://github.com/{repo}/pulls")

          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          url = f"https://api.github.com/repos/{repo}/issues/{issue}/comments"
          body = f"@{actor} 🚀 **All tasks completed!**\n\n👉 **[Click here to review and merge your Pull Request]({pr_url})**"
          requests.post(url, headers=headers, json={"body": body})
          EOF
