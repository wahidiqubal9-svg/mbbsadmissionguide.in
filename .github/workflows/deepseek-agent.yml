name: DeepSeek Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  agent:
    # 1. Never run on Pull Request comments
    # 2. Never trigger for any automated bots (Cloudflare, GitHub actions, etc.)
    if: |
      !github.event.issue.pull_request &&
      !endsWith(github.actor, '[bot]') &&
      github.actor != 'cloudflare-workers-and-pages[bot]' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Base Packages
        run: pip install openai requests

      - name: Run DeepSeek Engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os, sys, re, json, requests
          from openai import OpenAI

          api_key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          token = os.environ.get("GITHUB_TOKEN", "").strip()
          issue_no = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPO_NAME"]
          actor = os.environ["ACTOR"]
          user_text = os.environ.get("COMMENT_BODY", "").strip()

          if not api_key:
              print("DEEPSEEK_API_KEY secret is missing!")
              sys.exit(1)

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }
          comment_url = f"https://api.github.com/repos/{repo}/issues/{issue_no}/comments"

          def post_comment(text):
              requests.post(comment_url, headers=headers, json={"body": text})

          # Ingest Issue Discussion
          issue_data = requests.get(f"https://api.github.com/repos/{repo}/issues/{issue_no}", headers=headers).json()
          comments_data = requests.get(comment_url, headers=headers).json()

          convo = f"Title: {issue_data.get('title', '')}\nTask: {issue_data.get('body', '')}\n\n"
          if isinstance(comments_data, list):
              for c in comments_data:
                  login = c.get("user", {}).get("login", "")
                  if "[bot]" not in login:
                      convo += f"{login}: {c.get('body', '')}\n"

          # Ingest Repositories Files (ignoring large/irrelevant directories)
          code_dump = ""
          valid_exts = (".html", ".css", ".js", ".json", ".md")
          skip_dirs = {".git", ".github", "node_modules", "dist", "build"}

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".") and d not in skip_dirs]
              for f in files:
                  if f.endswith(valid_exts) and len(code_dump) < 60000:
                      fpath = os.path.relpath(os.path.join(root, f), ".")
                      try:
                          with open(fpath, "r", encoding="utf-8", errors="ignore") as file_read:
                              code_dump += f"\n\n--- [FILE: {fpath}] ---\n{file_read.read(8000)}\n"
                      except Exception:
                          pass

          client = OpenAI(api_key=api_key, base_url="https://api.deepseek.com")

          # -----------------------------------------------------------------
          # EXECUTE MODE (/apply)
          # -----------------------------------------------------------------
          if "/apply" in user_text.lower():
              post_comment("🤖 **Executing requested changes.** DeepSeek is updating files and creating the Pull Request...")

              prompt = (
                  "You are an autonomous senior developer.\n"
                  "Apply the requested changes and bug fixes to the codebase based on the discussion:\n\n"
                  f"Conversation History:\n{convo}\n\n"
                  f"Codebase:\n{code_dump}\n\n"
                  "INSTRUCTION:\n"
                  "Provide the FULL updated content of every modified file using this format:\n\n"
                  "===FILE: path/to/file.ext===\n"
                  "[complete updated file content]\n"
                  "===END FILE===\n\n"
                  "Do NOT output markdown blocks, explanations, or backticks around the delimiters."
              )

              res = client.chat.completions.create(
                  model="deepseek-chat",
                  messages=[
                      {"role": "system", "content": "You are a code deployment engine that strictly outputs delimited file blocks."},
                      {"role": "user", "content": prompt}
                  ],
                  temperature=0.1
              )

              out = res.choices[0].message.content
              matches = re.findall(r"===FILE:\s*(.+?)===\s*\n(.*?)===END FILE===", out, re.DOTALL)

              if not matches:
                  post_comment("⚠️ DeepSeek did not output delimited files. Please provide more explicit instructions.")
                  sys.exit(1)

              for fpath, body in matches:
                  fpath = fpath.strip()
                  folder = os.path.dirname(fpath)
                  if folder:
                      os.makedirs(folder, exist_ok=True)
                  with open(fpath, "w", encoding="utf-8") as fw:
                      fw.write(body.strip())

              with open("mode.txt", "w") as m:
                  m.write("EXECUTE")
              sys.exit(0)

          # -----------------------------------------------------------------
          # DISCUSS MODE
          # -----------------------------------------------------------------
          sys_prompt = (
              "You are an autonomous repository auditor and senior developer.\n"
              "Inspect the code, outline clear findings, and suggest exact file adjustments.\n"
              "Ask the user for adjustments, or instruct them to type '/apply' to build and open a Pull Request."
          )

          messages = [{"role": "system", "content": sys_prompt}]
          if isinstance(comments_data, list):
              for c in comments_data[-5:]:
                  role = "assistant" if "[bot]" in c.get("user", {}).get("login", "") else "user"
                  messages.append({"role": role, "content": c.get("body", "")})
          messages.append({"role": "user", "content": user_text})

          res = client.chat.completions.create(
              model="deepseek-chat",
              messages=messages,
              temperature=0.2
          )

          answer = res.choices[0].message.content + "\n\n---\n*Reply with refinements, or type **`/apply`** to branch, commit, and open a PR.*"
          post_comment(answer)

          with open("mode.txt", "w") as m:
              m.write("DISCUSS")
          EOF

      - name: Commit and Push
        if: success()
        run: |
          MODE=$(cat mode.txt 2>/dev/null || echo "DISCUSS")
          if [ "$MODE" != "EXECUTE" ]; then
            echo "Discussion step complete. Exiting."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ai-fix-issue-${{ github.event.issue.number }}"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "AI fixes for #${{ github.event.issue.number }}" || echo "No changes detected."
          git push -u origin "$BRANCH" --force

      - name: Create Pull Request
        id: cpr
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "ai-fix-issue-${{ github.event.issue.number }}"
          title: "Fixes for #${{ github.event.issue.number }}: ${{ github.event.issue.title }}"
          body: |
            Closes #${{ github.event.issue.number }}
            
            ### Summary
            Applied autonomous updates from DeepSeek V3 based on issue discussion.

      - name: Mention User on Complete
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          MODE=$(cat mode.txt 2>/dev/null || echo "DISCUSS")
          if [ "$MODE" != "EXECUTE" ]; then
            exit 0
          fi

          python - << 'EOF'
          import os, requests
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO_NAME"]
          issue = os.environ["ISSUE_NUMBER"]
          actor = os.environ["ACTOR"]

          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          url = f"https://api.github.com/repos/{repo}/issues/{issue}/comments"
          body = f"@{actor} 🚀 **All tasks completed!** Your Pull Request is open and ready to merge."
          requests.post(url, headers=headers, json={"body": body})
          EOF
