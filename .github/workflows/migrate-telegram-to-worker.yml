name: Migrate Telegram lead handling
on:
  push:
    branches: [security/remove-old-telegram-token]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate files
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          a = s.index('  /* ═══ TELEGRAM CONFIG ═══ */')
          b = s.index('  /* ═══ UI ═══ */', a)
          new = '''  /* ═══ LEAD SUBMISSION ═══ */
          async function submitLead(e){
            e.preventDefault();
            const btn=document.getElementById('leadSubmitBtn');
            const originalHTML=btn.innerHTML;
            btn.disabled=true; btn.style.opacity='.7'; btn.innerHTML='Sending…';
            const details={
              name:document.getElementById('leadName').value.trim(),
              phone:document.getElementById('leadPhone').value.trim(),
              neet:document.getElementById('leadNeet').value,
              country:document.getElementById('countrySelect').value,
              budget:document.getElementById('leadBudget').value,
              website:document.getElementById('leadWebsite')?.value||''
            };
            try{
              const r=await fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(details)});
              const d=await r.json().catch(()=>({}));
              if(!d.ok) throw new Error(d.error||'Unable to submit your request.');
              showLeadSuccess();
            }catch(err){
              btn.disabled=false; btn.style.opacity='1'; btn.innerHTML=originalHTML;
              showLeadError(details,err.message);
            }
          }

'''
          s=s[:a]+new+s[b:]
          marker='        <form id="leadFormEl" onsubmit="submitLead(event)">\\n'
          hp='''          <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label>Website <input type="text" id="leadWebsite" name="website" tabindex="-1" autocomplete="off"></label></div>\\n'''
          if 'id="leadWebsite"' not in s:
              s=s.replace(marker,marker+hp,1)
          p.write_text(s)

          Path('worker.js').write_text(r'''const H={'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'};
const out=(x,n=200)=>new Response(JSON.stringify(x),{status:n,headers:H});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
export default {async fetch(request,env){
  const u=new URL(request.url);
  if(u.pathname==='/api/lead'){
    if(request.method!=='POST') return out({ok:false,error:'Method not allowed'},405);
    const origin=request.headers.get('Origin');
    if(origin){try{if(new URL(origin).host!==u.host)return out({ok:false,error:'Forbidden'},403)}catch{return out({ok:false,error:'Forbidden'},403)}}
    let x; try{x=await request.json()}catch{return out({ok:false,error:'Invalid request'},400)}
    if(String(x?.website||'').trim()) return out({ok:true});
    const name=String(x?.name||'').trim(),phone=String(x?.phone||'').trim(),neet=String(x?.neet||'').trim(),country=String(x?.country||'').trim(),budget=String(x?.budget||'').trim();
    if(!name||name.length>100||!/^[0-9]{10}$/.test(phone)||!neet||neet.length>50||!country||country.length>50||!budget||budget.length>50)return out({ok:false,error:'Please check your details and try again.'},400);
    const token=env.TELEGRAM_BOT_TOKEN,chat=env.TELEGRAM_CHAT_ID;
    if(!token||!chat){console.error('Telegram secrets missing');return out({ok:false,error:'Service is temporarily unavailable.'},500)}
    const msg=['🎓 <b>New MBBS Abroad Lead</b>','━━━━━━━━━━━━━━━━━━',`👤 <b>Name:</b> ${esc(name)}`,`📱 <b>Phone:</b> ${esc(phone)}`,`📝 <b>NEET:</b> ${esc(neet)}`,`🌍 <b>Country:</b> ${esc(country)}`,`💰 <b>Budget:</b> ${esc(budget)}`,'━━━━━━━━━━━━━━━━━━',`🕒 ${new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',dateStyle:'medium',timeStyle:'short'})} IST`,'📍 Source: mbbsadmissionguide.in'].join('\n');
    try{const r=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chat,text:msg,parse_mode:'HTML',disable_web_page_preview:true})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){console.error('Telegram error',d?.description);return out({ok:false,error:'Unable to send your request right now.'},502)}return out({ok:true})}catch(e){console.error(e);return out({ok:false,error:'Unable to send your request right now.'},502)}
  }
  if(u.pathname.startsWith('/api/')) return out({ok:false,error:'Not found'},404);
  return env.ASSETS.fetch(request);
}};
''')
          Path('wrangler.jsonc').write_text('''{\n  "name": "mbbsadmissionguide-in",\n  "main": "worker.js",\n  "compatibility_date": "2026-09-01",\n  "assets": {"directory": ".", "binding": "ASSETS", "run_worker_first": ["/api/*"]}\n}\n''')
          Path('.assetsignore').write_text('worker.js\\nwrangler.jsonc\\n.assetsignore\\n.github/\\n.git/\\n')
          PY
      - name: Verify frontend is clean
        run: |
          ! grep -nE 'TELEGRAM_BOT_TOKEN|api\.telegram\.org/bot' index.html
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/migrate-telegram-to-worker.yml
          git add index.html worker.js wrangler.jsonc .assetsignore .github/workflows/migrate-telegram-to-worker.yml
          git commit -m 'chore: migrate telegram lead handling'
          git push origin HEAD:security/remove-old-telegram-token
