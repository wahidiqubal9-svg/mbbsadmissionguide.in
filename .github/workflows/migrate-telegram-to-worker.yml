name: Migrate Telegram lead handling

on:
  push:
    branches:
      - security/remove-old-telegram-token

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: migrate telegram lead handling') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Migrate frontend and add Worker
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          start_marker = '  /* ═══ TELEGRAM CONFIG ═══ */'
          end_marker = '  /* ═══ UI ═══ */'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''  /* ═══ LEAD SUBMISSION ═══ */
  async function submitLead(e){
    e.preventDefault();
    const btn = document.getElementById('leadSubmitBtn');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.style.opacity = '.7';
    btn.innerHTML = 'Sending…';

    const details = {
      name: document.getElementById('leadName').value.trim(),
      phone: document.getElementById('leadPhone').value.trim(),
      neet: document.getElementById('leadNeet').value,
      country: document.getElementById('countrySelect').value,
      budget: document.getElementById('leadBudget').value,
      website: document.getElementById('leadWebsite')?.value || ''
    };

    try{
      const res = await fetch('/api/lead', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(details)
      });
      const data = await res.json().catch(()=>({}));
      if(data.ok){
        showLeadSuccess();
      }else{
        throw new Error(data.error || 'Unable to submit your request.');
      }
    }catch(err){
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.innerHTML = originalHTML;
      showLeadError(details, err.message);
    }
  }

'''

          text = text[:start] + replacement + text[end:]

          honeypot = '''          <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden">
            <label>Website <input type="text" id="leadWebsite" name="website" tabindex="-1" autocomplete="off"></label>
          </div>
'''
          form_marker = '        <form id="leadFormEl" onsubmit="submitLead(event)">\n'
          if 'id="leadWebsite"' not in text:
              text = text.replace(form_marker, form_marker + honeypot, 1)

          index.write_text(text, encoding='utf-8')

          Path('worker.js').write_text(r'''const JSON_HEADERS = {
  'Content-Type': 'application/json; charset=utf-8',
  'Cache-Control': 'no-store'
};

function json(data, status = 200) {
  return new Response(JSON.stringify(data), {
    status,
    headers: JSON_HEADERS
  });
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

export default {
  async fetch(request, env) {
    const url = new URL(request.url);

    if (url.pathname === '/api/lead') {
      if (request.method !== 'POST') {
        return json({ ok: false, error: 'Method not allowed' }, 405);
      }

      const origin = request.headers.get('Origin');
      if (origin) {
        try {
          if (new URL(origin).host !== url.host) {
            return json({ ok: false, error: 'Forbidden' }, 403);
          }
        } catch {
          return json({ ok: false, error: 'Forbidden' }, 403);
        }
      }

      let lead;
      try {
        lead = await request.json();
      } catch {
        return json({ ok: false, error: 'Invalid request' }, 400);
      }

      if (String(lead?.website || '').trim()) {
        return json({ ok: true });
      }

      const name = String(lead?.name || '').trim();
      const phone = String(lead?.phone || '').trim();
      const neet = String(lead?.neet || '').trim();
      const country = String(lead?.country || '').trim();
      const budget = String(lead?.budget || '').trim();

      if (!name || name.length > 100 || !/^[0-9]{10}$/.test(phone) ||
          !neet || neet.length > 50 || !country || country.length > 50 ||
          !budget || budget.length > 50) {
        return json({ ok: false, error: 'Please check your details and try again.' }, 400);
      }

      const botToken = env.TELEGRAM_BOT_TOKEN;
      const chatId = env.TELEGRAM_CHAT_ID;
      if (!botToken || !chatId) {
        console.error('Telegram secrets are not configured.');
        return json({ ok: false, error: 'Service is temporarily unavailable.' }, 500);
      }

      const message = [
        '🎓 <b>New MBBS Abroad Lead</b>',
        '━━━━━━━━━━━━━━━━━━',
        `👤 <b>Name:</b> ${escapeHtml(name)}`,
        `📱 <b>Phone:</b> ${escapeHtml(phone)}`,
        `📝 <b>NEET:</b> ${escapeHtml(neet)}`,
        `🌍 <b>Country:</b> ${escapeHtml(country)}`,
        `💰 <b>Budget:</b> ${escapeHtml(budget)}`,
        '━━━━━━━━━━━━━━━━━━',
        `🕒 ${new Date().toLocaleString('en-IN', { timeZone:'Asia/Kolkata', dateStyle:'medium', timeStyle:'short' })} IST`,
        '📍 Source: mbbsadmissionguide.in'
      ].join('\n');

      try {
        const telegramResponse = await fetch(
          `https://api.telegram.org/bot${botToken}/sendMessage`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: chatId,
              text: message,
              parse_mode: 'HTML',
              disable_web_page_preview: true
            })
          }
        );

        const telegramData = await telegramResponse.json().catch(() => ({}));
        if (!telegramResponse.ok || !telegramData.ok) {
          console.error('Telegram API error:', telegramData?.description || telegramResponse.status);
          return json({ ok: false, error: 'Unable to send your request right now.' }, 502);
        }

        return json({ ok: true });
      } catch (error) {
        console.error('Telegram request failed:', error);
        return json({ ok: false, error: 'Unable to send your request right now.' }, 502);
      }
    }

    if (url.pathname.startsWith('/api/')) {
      return json({ ok: false, error: 'Not found' }, 404);
    }

    return env.ASSETS.fetch(request);
  }
};
''', encoding='utf-8')

          Path('wrangler.jsonc').write_text(r'''{
  "name": "mbbsadmissionguide-in",
  "main": "worker.js",
  "compatibility_date": "2026-09-01",
  "assets": {
    "directory": ".",
    "binding": "ASSETS",
    "run_worker_first": ["/api/*"]
  }
}
''', encoding='utf-8')

          Path('.assetsignore').write_text('worker.js\nwrangler.jsonc\n.assetsignore\n.github/\n.git/\n', encoding='utf-8')

      - name: Verify frontend contains no Telegram credential or API call
        run: |
          if grep -nE 'TELEGRAM_BOT_TOKEN|api\.telegram\.org/bot' index.html; then
            echo 'Telegram credential or direct Telegram API call remains in index.html.'
            exit 1
          fi

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/migrate-telegram-to-worker.yml
          git add index.html worker.js wrangler.jsonc .assetsignore .github/workflows/migrate-telegram-to-worker.yml
          git commit -m "chore: migrate telegram lead handling"
          git push origin HEAD:security/remove-old-telegram-token
